# Preview deploy on Render (free plan). Not for real tags: the free service sleeps when idle,
# the free database expires after 30 days and has no backups.
databases:
  - name: cartag-db
    plan: free
    databaseName: cartag
    user: cartag

services:
  - type: web
    name: cartag-demo
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Preview mode: production refuses to start until a real SMS provider exists.
      - key: APP_ENV
        value: development
      # Must match the address the site is opened on (the CSRF check compares it).
      - key: PUBLIC_BASE_URL
        value: https://cartag-demo.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: cartag-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: SMS_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: none
      - key: TRUST_PROXY
        value: "1"
      # The first admin is created at start-up from these. The password is generated by Render
      # and can be read in the service's Environment tab.
      - key: ADMIN_EMAIL
        value: admin@cartag.pk
      - key: ADMIN_PASSWORD
        generateValue: true
